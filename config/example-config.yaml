tenable_sc_scan_analysis:
  # Optional authoritative-source filters:
  # source_sites: "NYC,LON"
  # source_tags: "production"
  # source_name: "New York"
  # source_network_type: "private"
  # source_routing_type: "core"

  # Optional VLAN tag grouping: asset names retain the tag; scan names use a bucket.
  # When enabled, the first target tag starting with grouping_vlan_tag_prefix wins.
  # grouping_mode: vlan_tag
  # grouping_vlan_tag_prefix: vlan-
  # grouping_tag_map:
  #   vlan-server: SERVER
  #   vlan-mgmt: NETWORK
  #   vlan-workstation: WORKSTATION
  #   vlan-wireless: WORKSTATION

  # Tenable data source
  mode: offline
  scan_json_dir: /data/tenable/scans
  asset_json_dir: /data/tenable/assets
  sc_timeout_seconds: 60
  sc_retries: 3
  sc_backoff_seconds: 1.5
  sc_ssl_verify: true

  commands:
    validate_definitions:
      output_file: /data/output/normalized-definitions.json
    collect_tenable:
      output_file: /data/output/tenable-inventory.json
      fail_on_partial: true
    analyze_coverage:
      output_dir: /data/output
    propose_changes:
      output_dir: /data/output
    apply_changes:
      mode: live
      plan_file: /data/output/runs/approved-run-id/proposed_changes.csv
      repository_id: 7
      # Optional Tenable.sc Label for every asset tag this workflow creates/updates.
      # Existing asset labels are preserved.
      asset_label: Managed by Coverage Workflow
      result_file: /data/output/runs/approved-run-id/apply_result.json
    export_report:
      run_dir: /data/output/runs/approved-run-id
      output_dir: /data/output/report-bundle
