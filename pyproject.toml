[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-sc-scan-analysis"
version = "0.1.0"
description = "Analyze Tenable.sc scan scope coverage and generate Excel reports."
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ken Parker" }
]
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
live = [
    "pyTenable>=1.7",
]
dev = [
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ruff>=0.6",
]

[project.scripts]
tenable-scan-analysis = "tenable_scan_analysis.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
