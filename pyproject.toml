[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenable-sc-scan-analysis"
version = "2.2"
description = "Validate Tenable.sc scan and asset coverage against authoritative networks."
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ken Parker" }
]
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "subnet_as_code>=0.0.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
live = [
    "pyTenable>=1.7",
]
dev = [
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ruff>=0.6",
]

[project.scripts]
tenable-coverage-detect-plan = "src.tenable_coverage_workflow.run_detect_and_plan:main"
tenable-coverage-scheduled = "src.tenable_coverage_workflow.service_runner:main"
tenable-sc-scan-analysis = "src.tenable_coverage_workflow.application_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
