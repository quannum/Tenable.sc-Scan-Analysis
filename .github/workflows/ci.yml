name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0" "python-dotenv>=1.0" "black>=24.8" "mypy>=1.11" "ruff>=0.6"
          pip install --no-deps -e .

      - name: Run lint
        run: |
          ruff check .
          black --check .

      - name: Run type checks
        run: |
          mypy

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py"
