[tenable_coverage_workflow_service]
job_name = "tenable-coverage-all-sites"

# Authoritative expected-range source:
# Use rsg_subnet_as_code and intentionally leave source_sites unset so the workflow
# queries all sites returned by get_sites.
# source_sites = "NYC,LON"
# source_tags = "production"
# source_name = "New York"
# source_network_type = "private"
# source_routing_type = "core"

# Optional VLAN tag grouping for site-code-and-role asset/scan naming:
# The first tag starting with grouping_vlan_tag_prefix wins.
# grouping_mode = "vlan_tag"
# grouping_vlan_tag_prefix = "vlan-"
# grouping_tag_map = { vlan-server = "SERVER", vlan-storage = "SERVER", vlan-other = "SERVER", vlan-environment = "SERVER", vlan-mgmt = "NETWORK", vlan-workstation = "END_USER", vlan-wireless = "END_USER" }

# Output + scheduler state
output_dir = "/data/output"
run_id_prefix = "all-sites-"
latest_summary_file = "/data/output/latest_run.json"
lock_file = "/data/output/scheduler.lock"
stale_lock_timeout_seconds = 21600

# Detect-and-plan runs should remain dry-run.
dry_run = true

# Tenable data source:
# Recommended scheduled mode is live. Provide TCW_SC_URL, TCW_SC_ACCESS_KEY, and
# TCW_SC_SECRET_KEY via environment variables or a mounted secret. Legacy SC_*
# names are still accepted as fallbacks.
mode = "live"

# For offline mode instead, switch mode to "offline" and set these:
# scan_json_dir = "/data/tenable/scans"
# asset_json_dir = "/data/tenable/assets"

# Scan filtering
include_keywords = ""
exclude_keywords = ""
match_all_include = false
case_sensitive = false
filter_disabled_mode = "ALL"

# Logging
log_level = "INFO"
log_format = "json"
log_file = "/data/output/tenable-coverage-service.log"

# Tenable API transport settings
sc_timeout_seconds = 60
sc_retries = 3
sc_backoff_seconds = 1.5
sc_ssl_verify = true

# Optional explicit live-mode overrides if you do not want to rely on env vars:
# sc_url = "https://tenable-sc.example.internal"
# sc_access_key = "set-via-secret"
# sc_secret_key = "set-via-secret"
